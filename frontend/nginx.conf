# Serves the built React app. It sits behind the API gateway, which sends every path
# that isn't an API call here.

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # Security headers for the app's pages. The Content Security Policy only allows
  # scripts, styles and API calls from this same origin, which blocks most injected
  # content (XSS) from loading or sending data anywhere else.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Built assets have a content hash in their file name, so they can be cached forever:
  # a new build produces new names.
  location /assets/ {
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  # Everything else is a page of the single-page app. Always revalidate index.html so
  # users get new versions straight away.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
