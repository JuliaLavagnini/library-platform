{{- if .Values.ingress.enabled }}
{{- $ctx := dict "root" . "component" "gateway" -}}
# The way in from outside the cluster. Everything goes to the gateway, which does the
# routing, rate limiting and request IDs, exactly as in Docker Compose.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "lp.labels" $ctx | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "lp.name" $ctx }}
                port:
                  name: http
{{- end }}
