# API gateway: the single entry point to the platform.
#
#   /api/books...                  -> book-service
#   /api/auth, /api/users,
#   /api/loans, /.well-known/...   -> user-service
#   /docs/books/, /docs/users/     -> each service's Swagger UI
#   everything else                -> the web app
#
# It also hides internal endpoints, rate-limits clients, gives every request an ID, and
# writes JSON access logs. Later, TLS (HTTPS) will end here too.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  default_type application/json;

  # Temp files in /tmp so nginx can run as a non-root user.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # One JSON object per request, like the services' logs, so all logs can be searched
  # the same way (and later shipped to Loki).
  log_format json escape=json
    '{"time":"$time_iso8601","service":"gateway","request_id":"$request_id",'
    '"client_ip":"$remote_addr","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"upstream":"$upstream_addr","upstream_duration_s":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # Requests are small JSON documents; anything larger is refused early.
  client_max_body_size 100k;

  gzip on;
  gzip_types application/json text/css application/javascript;
  gzip_min_length 1024;

  # Every client IP may make 20 requests per second, with short bursts of up to 40.
  # (Login has a much stricter limit inside user-service.)
  limit_req_zone $binary_remote_addr zone=per_client:10m rate=20r/s;
  limit_req_status 429;

  # When another proxy sits in front (the Kubernetes Ingress controller), take the
  # client's real IP from X-Forwarded-For, but only if the request came from that trusted
  # proxy, so clients can't fake their IP. Without this, every request would appear to
  # come from the proxy and share one rate limit.
  set_real_ip_from ${GATEWAY_TRUSTED_PROXIES};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # The container's own DNS server (Docker's in Compose, the cluster's in Kubernetes),
  # filled in at startup. Looking services up per request (instead of once at startup)
  # means the gateway keeps working when a service restarts with a new IP.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

  server {
    listen 8080;

    # Where each upstream lives. Filled in from environment variables at startup (see
    # the Dockerfile), so the same image works in Docker Compose and in Kubernetes.
    set $book_service ${GATEWAY_BOOK_SERVICE_URL};
    set $user_service ${GATEWAY_USER_SERVICE_URL};
    set $web ${GATEWAY_WEB_URL};

    limit_req zone=per_client burst=40 nodelay;

    # Pass the request ID on and send it back, so one request can be followed through
    # the gateway's and each service's logs.
    add_header X-Request-ID $request_id always;
    proxy_set_header X-Request-ID $request_id;
    # The service echoes the same ID; hide its copy so clients get the header once.
    proxy_hide_header X-Request-ID;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # A fixed JSON body for errors raised by the gateway itself.
    error_page 429 = @too_many_requests;
    error_page 502 503 504 = @unavailable;
    proxy_intercept_errors off;

    location @too_many_requests {
      return 429 '{"error":{"message":"Too many requests. Slow down and try again."}}';
    }

    location @unavailable {
      return 503 '{"error":{"message":"Service temporarily unavailable, please try again later"}}';
    }

    location = /health {
      access_log off;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    # Internal endpoints: copies are only taken or returned as part of a loan, when
    # user-service calls book-service directly on the internal network. Hiding them here
    # adds a second layer of protection on top of book-service's own access check.
    location ~ ^/api/books/[^/]+/(borrow|return)/?$ {
      return 404 '{"error":{"message":"Not found"}}';
    }

    location /api/books {
      proxy_pass $book_service;
    }

    location ~ ^/api/(auth|users|loans)(/|$) {
      proxy_pass $user_service;
    }

    location = /.well-known/jwks.json {
      proxy_pass $user_service;
    }

    # Each service serves its Swagger UI at /docs/; the gateway puts them side by side.
    location = /docs/books {
      return 301 /docs/books/;
    }
    location /docs/books/ {
      rewrite ^/docs/books/(.*)$ /docs/$1 break;
      proxy_pass $book_service;
    }
    location = /docs/users {
      return 301 /docs/users/;
    }
    location /docs/users/ {
      rewrite ^/docs/users/(.*)$ /docs/$1 break;
      proxy_pass $user_service;
    }

    # Unknown API paths get a JSON 404, not the web app's HTML page.
    location /api/ {
      return 404 '{"error":{"message":"Not found"}}';
    }

    # Everything else is the web app (a single-page app: it handles its own routes).
    location / {
      proxy_pass $web;
    }
  }
}
