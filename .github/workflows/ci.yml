# Runs on every push to main and every pull request:
#   quality  - formatting, lint, types, and generated API types being up to date
#   test     - all unit, integration (real MongoDB via Testcontainers) and web app tests
#   e2e      - builds every image, starts the full stack with Docker Compose, and runs the
#              end-to-end checks through the gateway
#   images   - builds each image, scans it with Trivy, and (on main only, once everything
#              above has passed) publishes it to GitHub Container Registry with an SBOM and
#              build provenance
#
# Third-party actions are pinned to a commit SHA (with the version in a comment), so a
# moved or compromised tag can't change what runs here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the images job gets more, and only what it needs.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The web app's API types are generated from the services' OpenAPI documents. If a
      # service changed without regenerating them, the frontend could be out of step.
      - name: Check generated API types are up to date
        run: |
          npm run api:generate -w @library/web
          if ! git diff --exit-code -- frontend/src/api/generated; then
            echo "::error::Generated API types are out of date. Run 'npm run api:generate -w @library/web' and commit the result."
            exit 1
          fi

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Integration tests start MongoDB with Testcontainers, using the runner's Docker.
      # Fails if coverage drops below the thresholds in vitest.config.ts.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Fresh, throwaway secrets for this run only: nothing needs to be stored in GitHub.
      - name: Create .env for the stack
        run: |
          node scripts/generate-jwt-key.ts > .env
          echo "BOOTSTRAP_LIBRARIAN_EMAIL=ci-librarian@library.test" >> .env
          echo "BOOTSTRAP_LIBRARIAN_PASSWORD=$(openssl rand -hex 16)" >> .env

      - name: Build and start the stack
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Seed sample books
        run: npm run seed

      - name: Run end-to-end checks
        run: npm run test:e2e

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  images:
    name: Image (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    needs: [e2e]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # publish to GitHub Container Registry
      security-events: write # show scan results in the repository's Security tab
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: book-service
            context: .
            file: Dockerfile
            build-args: SERVICE=book-service
          - name: user-service
            context: .
            file: Dockerfile
            build-args: SERVICE=user-service
          - name: web
            context: .
            file: frontend/Dockerfile
            build-args: ''
          - name: gateway
            context: gateway
            file: gateway/Dockerfile
            build-args: ''
    env:
      # Only commits on main are published; pull requests are built and scanned only.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags: sha-<commit> (exact, never reused), latest (newest main), pr-<number> on PRs.
      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          build-args: ${{ matrix.image.build-args }}
          load: true
          tags: scan/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      # Fails on any HIGH or CRITICAL vulnerability that has a fix available.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.image.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          limit-severities-for-sarif: true

      # Dependabot's pull requests only get a read-only token, so they can't upload.
      - name: Show scan results in the Security tab
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: image-${{ matrix.image.name }}

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the cached build above, so this only adds the SBOM and provenance and pushes.
      - name: Publish image with SBOM and provenance
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          build-args: ${{ matrix.image.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image.name }}
