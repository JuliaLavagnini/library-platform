name: library-platform

# Runs the whole system locally:
#   docker compose up -d --build     start (rebuilding images after code changes)
#   docker compose logs -f           follow logs
#   docker compose down              stop (data is kept in the mongodb-data volume)

services:
  mongodb:
    image: mongo:8
    container_name: library-mongodb
    restart: unless-stopped
    ports:
      # Bound to localhost only: the database is not reachable from your network.
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  book-service:
    build:
      context: .
      args:
        SERVICE: book-service
    image: library-platform/book-service:dev
    container_name: library-book-service
    restart: unless-stopped
    environment:
      PORT: 8080
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongodb:27017/books
    ports:
      - '8080:8080'
    depends_on:
      mongodb:
        condition: service_healthy

  user-service:
    build:
      context: .
      args:
        SERVICE: user-service
    image: library-platform/user-service:dev
    container_name: library-user-service
    restart: unless-stopped
    environment:
      PORT: 8081
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongodb:27017/users
      # Containers reach each other by service name on the Compose network.
      BOOK_SERVICE_URL: http://book-service:8080
    ports:
      - '8081:8081'
    depends_on:
      mongodb:
        condition: service_healthy
      book-service:
        condition: service_healthy

volumes:
  mongodb-data:
